name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Install browser for website checks
        run: npx playwright install --with-deps chromium
      - name: Serve GitHub Pages source
        run: python3 -m http.server 8765 --directory . > /tmp/ai-vision-http.log 2>&1 &
      - name: Run website browser checks
        run: npm run website:check
        env:
          SITE_TEST_URL: http://127.0.0.1:8765/docs/
          WEBSITE_REPORT: outputs/website-browser-report.json
      - name: Save website browser report
        # Keep the original check failure visible without masking it with a
        # second failure when the browser check stopped before writing a report.
        if: always() && hashFiles('outputs/website-browser-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-report
          path: outputs/website-browser-report.json
          if-no-files-found: warn
