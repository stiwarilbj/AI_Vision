name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      # Pin third-party workflow code to resolved Node 24 releases so a moving
      # tag cannot silently change the release gate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Verify reviewed visual baselines before browser work
        run: npm run visual:baseline-files
      - name: Build the release archive
        run: npm run package
      - name: Verify the freshly built archive against source
        run: npm run package:verify
        env:
          RELEASE_ARCHIVE: dist/ai-vision-extension-v2.8.zip
      - name: Extract the release archive for Chromium
        run: |
          rm -rf /tmp/ai-vision-extension
          mkdir -p /tmp/ai-vision-extension
          unzip -q dist/ai-vision-extension-v2.8.zip -d /tmp/ai-vision-extension
      - name: Validate Store artwork dimensions and encoding
        run: npm run assets:check
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Serve GitHub Pages source
        run: python3 -m http.server 8765 --directory . > /tmp/ai-vision-http.log 2>&1 &
      - name: Run website browser checks
        run: npm run website:check
        env:
          SITE_TEST_URL: http://127.0.0.1:8765/docs/
          WEBSITE_REPORT: outputs/ci/website-browser-report.json
      - name: Run panel browser checks
        run: npm run panel:check
        env:
          UI_SCREENSHOTS: outputs/ci/panel
          PLAYWRIGHT_TRACE_DIR: outputs/ci/traces/panel
      - name: Compare reviewed panel visual baselines
        run: npm run visual:check
        env:
          PANEL_SCREENSHOTS: outputs/ci/panel
          VISUAL_REPORT: outputs/ci/visual-report.json
          VISUAL_DIFF_DIR: outputs/ci/visual-diffs
      - name: Run the packaged extension in isolated Chromium profiles
        run: npm run extension:check
        env:
          EXTENSION_PATH: /tmp/ai-vision-extension
          EXTENSION_REPORT: outputs/ci/extension-browser-report.json
          EXTENSION_SCREENSHOTS: outputs/ci/extension-browser
      - name: Save browser reports and screenshots
        if: always() && hashFiles('outputs/ci/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-vision-ci-reports
          path: outputs/ci/
          if-no-files-found: warn
          retention-days: 30

  quality-gate:
    if: always()
    needs: checks
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every mandatory check
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "Mandatory CI checks finished with: $CHECKS_RESULT"
            exit 1
          fi
          echo "All mandatory AI Vision checks passed."
