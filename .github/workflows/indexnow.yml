name: Notify IndexNow

on:
  workflow_run:
    workflows: ["Pages"]
    types: [completed]

concurrency:
  group: indexnow-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  notify:
    # Only a successful Pages workflow for this repository's main branch can
    # notify Bing. Pages itself verifies the artifact before this event fires.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0

      - name: Reject a superseded deployment
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$current" || "$current" != "$DEPLOY_COMMIT" ]]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "Pages workflow $DEPLOY_COMMIT is no longer the current main commit ($current); skipping IndexNow."
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect website content changes
        id: changed
        if: steps.current.outputs.superseded == 'false'
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff-tree --root --no-commit-id --name-only -r -m "$DEPLOY_COMMIT")"
          if printf '%s\n' "$files" | grep -q '^docs/'; then
            {
              echo 'changed=true'
              echo 'files<<INDEXNOW_FILES'
              printf '%s\n' "$files" | grep '^docs/'
              echo 'INDEXNOW_FILES'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'files=' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore an acknowledged receipt for this commit
        if: steps.current.outputs.superseded == 'false' && steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .indexnow-previous
          previous_run="$(gh run list --workflow indexnow.yml --status completed --limit 30 --json databaseId,headSha --jq '.[] | select(.headSha == env.DEPLOY_COMMIT) | .databaseId' | head -n 1 || true)"
          if [[ -n "$previous_run" ]]; then gh run download "$previous_run" --name indexnow-receipt --dir .indexnow-previous || true; fi
          receipt="$(find .indexnow-previous -type f -name indexnow-receipt.json -print -quit || true)"
          if [[ -n "$receipt" ]]; then echo "INDEXNOW_RECEIPT_FILE=$receipt" >> "$GITHUB_ENV"; fi

      - name: Verify the deployed Pages files and notify IndexNow
        if: steps.current.outputs.superseded == 'false' && steps.changed.outputs.changed == 'true'
        env:
          WEBSITE_CHANGED: 'true'
          INDEXNOW_DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
          INDEXNOW_CHANGED_FILES: ${{ steps.changed.outputs.files }}
          INDEXNOW_KEY_FILE: docs/ai-vision-indexnow-20260910.txt
          INDEXNOW_KEY_LOCATION: https://stiwarilbj.github.io/AI_Vision/ai-vision-indexnow-20260910.txt
          INDEXNOW_ENDPOINT: https://www.bing.com/indexnow
          INDEXNOW_LIVE_ATTEMPTS: '12'
          INDEXNOW_LIVE_DELAY_MS: '10000'
          INDEXNOW_SUBMIT_TIMEOUT_MS: '15000'
        run: |
          mkdir -p outputs
          node scripts/notify-indexnow.js --submit --changed --output outputs/indexnow-response.json --receipt outputs/indexnow-receipt.json

      - name: Save IndexNow receipt
        if: always() && steps.current.outputs.superseded == 'false' && steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: indexnow-receipt
          path: |
            outputs/indexnow-response.json
            outputs/indexnow-receipt.json
          if-no-files-found: warn
          retention-days: 30
