<body>
  <main id="art" class="artboard" aria-label="AI Vision Chrome extension store screenshot"></main>
  <script>
    const slide = new URLSearchParams(location.search).get('slide') || '1';
    const mark = '<span class="mark" aria-hidden="true"></span>';
    const brand = `<div class="brand">${mark}<span>AI Vision</span></div>`;
    const panelHead = (mode, icon = '◉') => `<div class="panel-head"><span class="panel-name"><span class="panel-icon">${icon}</span>AI Vision</span><span class="panel-tools"><span>⚙</span><span class="panel-close">×</span></span></div><div class="panel-body"><div class="select-row"><span>Ask about</span><span class="select">${mode}</span></div>`;
    const endPanel = '</div></div>';
    const slides = {
      '1': `<section class="slide-1 artboard">${brand}<div class="copy"><p class="eyebrow">SCREENSHOT INSIGHT</p><h1>See it<br>Understand it</h1><p class="subline">Ask Gemini what the pixels mean</p><span class="chip"><i class="chip-dot"></i>VISUAL ANSWERS</span></div><div class="panel">${panelHead('Screenshot', '◉')}<div class="capture-card"><span class="chart-title">WEEKLY READING</span><div class="chart"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div></div><div class="panel-card answer-card"><span class="tiny-label">GEMINI ANSWER</span><strong>Reading climbs from 40 to 100 pages</strong><span class="mini-text">The biggest lift appears in week three</span><div class="answer-actions"><span class="mock-button secondary">Copy answer</span><span class="mock-button primary">Ask follow up</span></div></div><div class="panel-card followup"><span class="tiny-label">ASK A FOLLOW UP</span><span class="mock-button primary">Ask Gemini</span></div>${endPanel}</div></section>`,
      '2': `<section class="slide-2 artboard">${brand}<div class="copy"><p class="eyebrow">OCR POWER</p><h1>Images into<br>editable text</h1><p class="subline">Turn locked pixels into useful words</p><span class="chip"><i class="chip-dot"></i>IMAGE TO TEXT</span></div><div class="source-card"><div class="scan-mark"></div><div class="scan-text">Q4 PLAN<span>WEEKLY READING</span><span>40 60 90 100</span></div></div><div class="ocr-card">${panelHead('Screenshot', '▣')}<div class="ocr-image"><strong>WEEKLY READING</strong>Numbers hidden in an image</div><div class="ocr-result"><span class="tiny-label">EXTRACTED TEXT</span><div class="ocr-lines"><span>Week 1 <i>40 pages</i></span><span>Week 2 <i>60 pages</i></span><span>Week 3 <i>90 pages</i></span><span>Week 4 <i>100 pages</i></span></div><span class="mock-button">Copy text</span></div>${endPanel}</div></section>`,
      '3': `<section class="slide-3 artboard">${brand}<div class="copy"><p class="eyebrow">WEBPAGE TLDR</p><h1>Long page<br>Short answer</h1><p class="subline">Scan a page and keep the signal</p><span class="chip"><i class="chip-dot"></i>SMART SUMMARIES</span></div><div class="article-window"><div class="browser-bar"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i></div><div class="article-tag">READING NOTES</div><div class="article-title">Climate systems<br>in clear view</div><div class="article-lines"><span></span><span></span><span></span><span></span></div></div><div class="summary-panel">${panelHead('This page', '≡')}<div class="summary-hero"><strong>Main point</strong><span>The article maps how small shifts can change a larger system</span></div><div class="takeaways"><div class="takeaway"><b>1</b><span>Find the signal fast</span></div><div class="takeaway"><b>2</b><span>Keep the useful context</span></div><div class="takeaway"><b>3</b><span>Ask a sharper follow up</span></div></div><span class="mock-button">Ask a follow up</span>${endPanel}</div></section>`,
      '4': `<section class="slide-4 artboard">${brand}<div class="copy"><p class="eyebrow">MULTI TAB RESEARCH</p><h1>Compare tabs<br>Find clarity</h1><p class="subline">Bring the useful details together</p><span class="chip"><i class="chip-dot"></i>UP TO 20 TABS</span></div><div class="tabs-fan"><div class="tab"><div class="tab-top"><span>DAYLIGHT 18</span><span>◌</span></div><div class="tab-body"><span></span><span></span><span></span></div></div><div class="tab"><div class="tab-top"><span>CLOUDPACK 22</span><span>◌</span></div><div class="tab-body"><span></span><span></span><span></span></div></div><div class="tab"><div class="tab-top"><span>TRAVEL KIT</span><span>◌</span></div><div class="tab-body"><span></span><span></span><span></span></div></div></div><div class="compare-board"><div class="compare-head"><strong>Useful details</strong><span class="select">All tabs</span></div><div class="compare-row"><span>DETAIL</span><span>DAYLIGHT</span><span>CLOUDPACK</span><span>TRAVEL KIT</span></div><div class="compare-row"><span>Weight</span><span>250 g</span><span>310 g</span><span>280 g</span></div><div class="compare-row"><span>Laptop sleeve</span><span class="yes">Included</span><span class="maybe">Missing</span><span class="yes">Included</span></div><div class="compare-row"><span>Rain cover</span><span class="maybe">Missing</span><span class="yes">Included</span><span class="maybe">Missing</span></div><span class="mock-button primary">Ask Gemini</span></div></section>`,
      '5': `<section class="slide-5 artboard">${brand}<div class="copy"><p class="eyebrow">BROWSER TASKS</p><h1>Your browser<br>Your command</h1><p class="subline">Keep every action in your hands</p><span class="chip"><i class="chip-dot"></i>APPROVAL GATED</span></div><div class="route"></div><div class="task-stack"><div class="task-step"><b>STEP ONE</b>Read the page</div><div class="task-step active"><b>STEP TWO</b>Ask before action</div><div class="task-step"><b>STEP THREE</b>Continue with control</div></div><div class="approval-panel">${panelHead('Screenshot', '✦')}<div class="approval-note">Browser tasks use the screenshot and act only in this page</div><div class="approval-card"><strong>Approval required</strong><p>AI Vision wants to click Example page action</p><div class="approval-actions"><span class="mock-button primary">Approve</span><span class="mock-button secondary">Stop task</span></div></div></div></section>`
    };
    const rendered = document.createRange().createContextualFragment(slides[slide] || slides['1']);
