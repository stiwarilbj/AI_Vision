<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Vision permissions</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-width: 360px; background: #f3f8ff; color: #102b55; }
    main { max-width: 620px; margin: 48px auto; padding: 32px; background: #ffffff; border: 1px solid #b8cfea; border-radius: 20px; box-shadow: 0 20px 50px rgba(31, 70, 121, .12); }
    h1 { margin: 0 0 12px; font-size: 24px; letter-spacing: -.03em; }
    p { line-height: 1.55; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    button { border: 1px solid #1d62cb; border-radius: 10px; padding: 11px 16px; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid rgba(50, 121, 232, .25); outline-offset: 2px; }
    #grant { background: #3279e8; color: white; }
    #cancel { background: white; color: #1d62cb; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 24px; color: #637a96; }
    .error { color: #a32929 !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Enable AI Vision access?</h1>
    <p id="description">AI Vision requests optional access only when a feature needs it.</p>
    <p id="status" role="status" aria-live="polite">Choose Allow to continue.</p>
    <div class="actions">
      <button id="grant" type="button">Allow</button>
      <button id="cancel" type="button">Cancel</button>
    </div>
  </main>
  <script src="permission.js"></script>
</body>
</html>
