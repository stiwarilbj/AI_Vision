<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Vision permissions</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-width: 360px; background: #f4f9ff; color: #18324f; }
    main { max-width: 620px; margin: 48px auto; padding: 32px; background: white; border: 1px solid #bdd8f7; border-radius: 18px; box-shadow: 0 20px 50px rgba(21, 65, 115, .14); }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { line-height: 1.55; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    button { border: 1px solid #1267d7; border-radius: 10px; padding: 11px 16px; font: inherit; cursor: pointer; }
    #grant { background: #1267d7; color: white; }
    #cancel { background: white; color: #1267d7; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 24px; color: #637a96; }
    .error { color: #a32929 !important; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Enable AI Vision access?</h1>
    <p id="description">AI Vision requests optional access only when a feature needs it.</p>
    <p id="status" role="status" aria-live="polite">Choose Allow to continue.</p>
    <div class="actions">
      <button id="grant" type="button">Allow</button>
      <button id="cancel" type="button">Cancel</button>
    </div>
  </main>
  <script src="permission.js"></script>
</body>
</html>
