<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Vision assistant panel harness</title>
  <link rel="stylesheet" href="../../src/content/assistant-panel.css">
  <style>
    body { min-height: 100vh; margin: 0; padding: 48px; box-sizing: border-box; font: 16px/1.5 system-ui, sans-serif; background: #f4f9ff; color: #16324f; }
    main { max-width: 680px; }
  </style>
</head>
<body>
  <main>
    <h1>Assistant panel test page</h1>
    <p>This local page supplies fake Chrome APIs so contributors can inspect the injected interface without installing the extension or using a real Gemini API key.</p>
    <button type="button">Example page action</button>
  </main>
  <script>
    window.__aiVisionTestSettings = {
      geminiModel: 'gemini-3.5-flash',
      geminiTemperature: 1,
      geminiMode: 'tab',
      geminiResponseStyle: 'balanced',
      geminiAgentMode: false,
      hasApiKey: true,
      apiKeyMasked: '••••-key'
    };

    const runtimeListeners = new Set();
    window.chrome = {
      storage: {
        local: {
          get(keys, callback) {
            const result = {};
            for (const key of keys) result[key] = window.__aiVisionTestSettings[key];
            callback(result);
          },
          set(values, callback) {
            Object.assign(window.__aiVisionTestSettings, values);
            if (callback) callback();
          }
        }
      },
      runtime: {
        getURL(file) { return `../../${file}`; },
        onMessage: {
          addListener(listener) { runtimeListeners.add(listener); },
          removeListener(listener) { runtimeListeners.delete(listener); }
        },
        async sendMessage(request) {
          if (request.action === 'captureVisibleTab') return 'data:image/jpeg;base64,dGVzdA==';
          if (request.action === 'getSettings') return window.__aiVisionTestSettings;
          if (request.action === 'getAvailableModels') return { models: ['gemini-3.5-flash'] };
          if (request.action === 'saveSettings') {
            Object.assign(window.__aiVisionTestSettings, {
              geminiModel: request.geminiModel,
              geminiTemperature: request.geminiTemperature,
              geminiMode: request.geminiMode,
              geminiResponseStyle: request.geminiResponseStyle,
              geminiAgentMode: request.geminiAgentMode
            });
            if (request.clearApiKey) {
              window.__aiVisionTestSettings.hasApiKey = false;
              window.__aiVisionTestSettings.apiKeyMasked = '';
            } else if (request.apiKey) {
              window.__aiVisionTestSettings.hasApiKey = true;
              window.__aiVisionTestSettings.apiKeyMasked = '••••-key';
            }
            return window.__aiVisionTestSettings;
          }
          if (request.action === 'collectSourceTabContext') {
            return { tabs: [{ title: document.title, url: location.href, text: document.body.innerText }] };
          }
          if (request.action === 'collectWindowContext') {
            return { tabs: [{ title: document.title, url: location.href, text: document.body.innerText }] };
          }
          if (request.action === 'ensureAllTabsAccess') return { granted: true };
          if (request.action === 'askGemini') return { requestId: request.requestId, text: 'Local test response.' };
          if (request.action === 'startAgentTask') {
            const taskId = 'local-test-task';
            setTimeout(() => runtimeListeners.forEach((listener) => listener({ action: 'agentModeComplete', taskId, summary: 'Local test task completed.' }, {}, () => {})), 0);
            return { taskId };
          }
          return null;
        }
      }
    };
  </script>
  <script src="../../src/content/capture-utils.js"></script>
  <script src="../../src/content/assistant-panel.js"></script>
</body>
</html>
