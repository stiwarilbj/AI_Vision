<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>AI Vision public v2.5 demo storyboard</title>
<style>
  html,body{margin:0;background:#eaf6ff;font-family:Arial,sans-serif}
  canvas{display:block;width:1280px;height:720px}
</style>
<canvas id="demo" width="1280" height="720" aria-label="AI Vision demo"></canvas>
<script>
  const slides = [
    {title:'Select a screenshot', body:'Open AI Vision on a normal webpage, choose Capture, and drag around the detail you want to understand.', image:'01-select-capture.png'},
    {title:'Ask Gemini a clear question', body:'Use Explain, Summarize, Answer, or write your own question. Your Gemini key stays in Chrome.', image:'02-answer-follow-up.png'},
    {title:'Copy the useful text', body:'Ask for a faithful transcription, check important numbers, then copy the answer or ask a follow-up.', image:'03-copy-text.png'},
    {title:'Try AI Vision in Chrome', body:'Free to install · Your own Gemini API key required · Chrome Web Store pages cannot be analyzed.', image:'02-answer-follow-up.png'}
  ];
  const canvas = document.getElementById('demo');
  const ctx = canvas.getContext('2d');
  const assets = [];
  function load(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;});}
  function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
  function drawImageContain(img,x,y,w,h){const scale=Math.min(w/img.width,h/img.height);const dw=img.width*scale,dh=img.height*scale;ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
  function draw(slideIndex,progress){
    const s=slides[slideIndex];
    ctx.fillStyle='#eaf6ff';ctx.fillRect(0,0,1280,720);
    ctx.fillStyle='#cfeaff';ctx.beginPath();ctx.arc(1190,60,180,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#164472';ctx.font='700 18px Arial';ctx.fillText('AI VISION  ·  PUBLIC STORE V2.5',72,72);
    ctx.fillStyle='#123a63';ctx.font='700 48px Arial';ctx.fillText(s.title,72,152);
    ctx.fillStyle='#4c6e90';ctx.font='24px Arial';
    const words=s.body.split(' ');let line='',yy=202;for(const w of words){const next=line?line+' '+w:w;if(ctx.measureText(next).width>470){ctx.fillText(line,72,yy);yy+=35;line=w}else line=next}if(line)ctx.fillText(line,72,yy);
    ctx.fillStyle='#0c6bc1';ctx.font='700 16px Arial';ctx.fillText('FICTIONAL EXAMPLE · ILLUSTRATIVE RESPONSE',72,620);
    rounded(72,645,310,44,22,'#146fc4');ctx.fillStyle='#fff';ctx.font='700 17px Arial';ctx.fillText('Add AI Vision to Chrome  ↗',98,673);
    rounded(620,48,570,624,28,'#fff','#b9daf4');drawImageContain(assets[slideIndex],660,78,490,540);
    ctx.fillStyle='#4c6e90';ctx.font='14px Arial';ctx.fillText('AI Vision · screenshot assistant for Chrome',660,650);
    if(progress<0.08){ctx.fillStyle='#fff';ctx.globalAlpha=(0.08-progress)*12;ctx.fillRect(0,0,1280,720);ctx.globalAlpha=1}
  }
  async function record(){
    for(const s of slides) assets.push(await load(s.image));
    const stream=canvas.captureStream(30);
    const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'});
    const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    const done=new Promise(resolve=>recorder.onstop=async()=>resolve(await new Blob(chunks,{type:'video/webm'}).arrayBuffer()));
    recorder.start(250);
    const total=24000,start=performance.now();
    while(performance.now()-start<total){const elapsed=performance.now()-start;const index=Math.min(slides.length-1,Math.floor(elapsed/6000));draw(index,(elapsed%6000)/6000);await new Promise(requestAnimationFrame)}
    recorder.stop();
    const buffer=await done;let binary='';const bytes=new Uint8Array(buffer);for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(binary);
  }
  window.recordDemo=record;
  load(slides[0].image).then(img=>{assets[0]=img;draw(0,1)});
</script>
</html>
